# expect: cycle without timeouts
id: bad_play
name: Bad
phase: in_possession
objective: retain_possession
roles:
  - {id: R1, hints: [CM], starts_with_ball: true}
  - {id: R2, hints: [CM]}
triggers: {possession: us}
success: {event: pass_completed}
max_duration_s: 5
steps:
  - id: s1
    actions: [{role: R1, type: pass, to: {role: R2}}]
    done_when: {event: pass_completed}
    next: s2
  - id: s2
    actions: [{role: R2, type: pass, to: {role: R1}}]
    done_when: {event: pass_completed}
    next: s1
