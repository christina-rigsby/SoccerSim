# Module 3 training (spec §10–12). "smoke" exercises every stage in seconds (tests);
# "quick" makes the pipeline runnable in well under an hour on a laptop CPU; "spec"
# values match the spec's sizes and are what a real run uses.

profile: quick

rewards:
  goal: 1.0
  c_loss_own_half: 0.01
  regain_bonus: 0.02
  gamma_per_play: 0.97
  retain_cap: 0.02          # cap on summed reward from consecutive non-improving retain_possession plays
  shot_xg: 0.5              # a shot adds 0.5 x its xG (an opponent's shot subtracts it)
  target: possession_return # what the critic and the generator learn from: reward | possession_return

encoder:
  smoke: {hidden: 32, layers: 2, heads: 2}
  quick: {hidden: 64, layers: 3, heads: 4}
  spec: {hidden: 128, layers: 4, heads: 4}

generator:
  smoke: {d_model: 32, layers: 1, heads: 2}
  quick: {d_model: 128, layers: 3, heads: 4}
  spec: {d_model: 256, layers: 6, heads: 8}
  sample_temperature: 1.0

critic:
  smoke: {d_model: 32, layers: 1, heads: 2, epochs: 1, lr: 0.002, batch: 64, max_rows: 2000}
  quick: {d_model: 64, layers: 2, heads: 4, epochs: 8, lr: 0.002, batch: 128, max_rows: null}  # all Phase A decisions (D-046)
  spec: {d_model: 128, layers: 3, heads: 4, epochs: 40, lr: 0.001, batch: 256, max_rows: null}

response:
  smoke: {epochs: 1, lr: 0.002}
  quick: {epochs: 6, lr: 0.002}
  spec: {epochs: 30, lr: 0.001}

bc:
  smoke: {epochs: 1, lr: 0.001, batch: 32, max_examples: 500}
  quick: {epochs: 6, lr: 0.001, batch: 64, max_examples: 12000}
  spec: {epochs: 30, lr: 0.0005, batch: 128, max_examples: null}

mutation:
  smoke: {mutants_per_play: 1, rollouts: 2, keep_quantile: 0.5}
  quick: {mutants_per_play: 10, rollouts: 6, keep_quantile: 0.5}
  spec: {mutants_per_play: 40, rollouts: 20, keep_quantile: 0.25}

ppo:
  smoke: {updates: 1, episodes_per_update: 2, epochs: 1, clip: 0.2, kl_beta: 0.05, lr: 0.0003}
  quick: {updates: 6, episodes_per_update: 8, epochs: 3, clip: 0.2, kl_beta: 0.05, lr: 0.0003}
  spec: {updates: 400, episodes_per_update: 64, epochs: 4, clip: 0.2, kl_beta: 0.05, lr: 0.0001}

qd:
  min_evals_smoke: 1
  min_evals_quick: 3
  min_evals_spec: 50

phase_a:
  smoke: {episodes: 8}
  quick: {episodes: 240}
  spec: {episodes: 12000}   # ~200k decision records

# The library-only learned play selector (soccersim/selfplay/selector.py): iterations of
# games (calling a random feasible play with probability epsilon) then a refit on Phase A
# data plus all its own games (always kept; Phase A sampled up to max_rows in total).
selector:
  iterations: 4
  games_per_iteration: 300
  epsilon_start: 0.2
  epsilon_end: 0.05
  max_rows: 60000
