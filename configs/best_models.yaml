# The best trained models so far: what the evaluation team names `selector` and `main` play with
# (soccersim/selfplay/evaluate.py). `selector_latest` / `main_latest` use the newest models in
# data/models instead. Update this when a newly trained model beats the one listed here in a
# paired evaluation (scripts/evaluate_teams.py).
#
# Play identities are positions in the sorted library, so a model only works with the library it
# was trained on: in the pool v5 library run 4's selector scores -0.018 xG per game against the
# plain library, run 5's +0.078 (reports/evaluation/best_models_pool_v5).
selector: models_best/selector   # run 5's library-only learned selector (pool v5)
main: models_best/main           # run 4's main agent (pool v3; +0.046 in the v5 library, run 5's +0.020)
