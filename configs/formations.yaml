# Formation slots in the team's attacking frame (attack toward +x; +y is the team's
# left). Each slot has a kind (mapped to a side-relative hint at play instantiation,
# spec §3.6), an out-of-possession base position and an in-possession base position.
#
# kind -> hint: GK->GK, CB->CB_near/CB_far, FB->FB_near/FB_far, DM->DM, CM->CM, AM->AM,
# W->W_near/W_far, ST->ST. "near" is decided by the slot's y sign vs the frozen side.

shape:
  shift_x_in: 0.55       # fraction of ball x the block follows, in possession
  shift_x_out: 0.45      # ... and out of possession
  shift_y: 0.35
  width_in: 1.0          # lateral scaling in possession
  width_out: 0.75        # lateral scaling out of possession
  onside_margin: 0.8     # in possession, attackers hold this far behind the offside line
  max_depth_ahead_of_ball_out: 12.0  # out of possession, nobody stays more than this far ahead of the ball

formations:
  "4-3-3":
    GK:   {kind: GK, out: [-48, 0], in: [-45, 0]}
    LB:   {kind: FB, out: [-32, 20], in: [-4, 27]}
    LCB:  {kind: CB, out: [-35, 7], in: [-20, 11]}
    RCB:  {kind: CB, out: [-35, -7], in: [-20, -11]}
    RB:   {kind: FB, out: [-32, -20], in: [-4, -27]}
    CDM:  {kind: DM, out: [-24, 0], in: [-9, 0]}
    LCM:  {kind: CM, out: [-14, 11], in: [5, 13]}
    RCM:  {kind: CM, out: [-14, -11], in: [5, -13]}
    LW:  {kind: W,  out: [-4, 21],   in: [16, 25]}
    ST:   {kind: ST, out: [0, 0], in: [26, 0]}
    RW:  {kind: W,  out: [-4, -21],  in: [16, -25]}
  "4-4-2":
    GK:   {kind: GK, out: [-48, 0], in: [-45, 0]}
    LB:   {kind: FB, out: [-32, 20], in: [-5, 27]}
    LCB:  {kind: CB, out: [-35, 7], in: [-20, 11]}
    RCB:  {kind: CB, out: [-35, -7], in: [-20, -11]}
    RB:   {kind: FB, out: [-32, -20], in: [-5, -27]}
    LM:  {kind: W,  out: [-16, 21],  in: [6, 25]}
    LCM:  {kind: CM, out: [-18, 7], in: [2, 8]}
    RCM:  {kind: DM, out: [-18, -7], in: [-2, -8]}
    RM:  {kind: W,  out: [-16, -21], in: [6, -25]}
    LS:   {kind: ST, out: [-2, 6], in: [25, 6]}
    RS:   {kind: AM, out: [-4, -6], in: [20, -6]}
  "3-5-2":
    GK:   {kind: GK, out: [-48, 0], in: [-45, 0]}
    LCB:  {kind: CB, out: [-34, 12], in: [-19, 16]}
    CB:   {kind: CB, out: [-36, 0], in: [-22, 0]}
    RCB:  {kind: CB, out: [-34, -12], in: [-19, -16]}
    LWB:  {kind: FB, out: [-26, 25], in: [6, 28]}
    RWB:  {kind: FB, out: [-26, -25], in: [6, -28]}
    CDM:  {kind: DM, out: [-22, 0], in: [-6, 0]}
    LCM:  {kind: CM, out: [-12, 10], in: [8, 12]}
    RCM:  {kind: CM, out: [-12, -10], in: [8, -12]}
    LS:   {kind: ST, out: [0, 6], in: [26, 6]}
    RS:   {kind: AM, out: [-2, -6], in: [22, -6]}

