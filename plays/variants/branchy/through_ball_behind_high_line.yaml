# Variant play (branchy): shorter version of plays/offensive/through_ball_behind_high_line.yaml with a fallback in every
# step (pass to the best-placed teammate or carry into space) instead of waiting and timing out.
id: through_ball_behind_high_line
name: Through ball behind a high line
version: 2
phase: in_possession
objective: create_chance
strategy: exploit_depth
roles:
- id: R1
  desc: Passer facing forward
  hints:
  - CM
  - AM
  - DM
  - CB_near
  requires:
    passing: 0.6
    vision: 0.5
  starts_with_ball: true
- id: R2
  desc: Runner in behind
  hints:
  - ST
  - W_near
  - W_far
  requires:
    pace: 0.65
  prefers:
    finishing: 0.8
    acceleration: 0.8
- id: R3
  desc: Second runner / decoy
  hints:
  - W_far
  - AM
  - ST
  prefers:
    pace: 0.5
triggers:
  all:
  - possession: us
  - has_ball: R1
  - ball_in_zone:
    - mid_own.*
    - mid_opp.*
  - line_height:
      line: opp_last_line
      gt: 35
  - pressure_on:
      ref: role:R1
      gt: 3
hard_constraints:
- onside: R2
steps:
- id: s1
  choose:
  - when:
      all:
      - onside: R2
      - lane_open:
          from: R1
          to:
            space_behind:
              line: opp_last_line
              lane: center
              depth: 10
          min_p: 0.4
    actions:
    - role: R2
      type: spin_in_behind
      line: opp_last_line
      lane: center
      depth: 10
    - role: R3
      type: decoy_run
      to:
        anchor: line:opp_last_line
        offset:
        - -2
        - -12
    - role: R1
      type: pass
      to:
        space_behind:
          line: opp_last_line
          lane: center
          depth: 10
      style: through
  - when:
      lane_open:
        from: R1
        to:
          role: R2
        min_p: 0.7
    actions:
    - role: R1
      type: pass
      to:
        role: R2
      style: driven
  - when: always
    actions:
    - role: R1
      type: carry
      to:
        pc_best:
          zone: mid_opp.*
        score: pc_xt
      speed: fast
  done_when:
    any:
    - has_ball: R2
    - event: pass_completed
    - event: pass_intercepted
    - event: ball_out
    - step_elapsed_s:
        gt: 2
  timeout_s: 3
  on_timeout: next
- id: s2
  choose:
  - when:
      xg:
        ref: ball_holder
        gt: 0.12
    actions:
    - actor: ball_holder
      type: shoot
      placement: auto
      style: placed
  - when: always
    actions:
    - actor: ball_holder
      type: carry
      to:
        anchor: penalty_spot
        offset:
        - 0
        - 0
      speed: max
    - role: R3
      type: run_to
      to:
        zone: far_post_area
      speed: max
  done_when:
    any:
    - event: shot_taken
    - ball_in_zone: box
    - step_elapsed_s:
        gt: 2.5
  timeout_s: 3
  on_timeout: abort
success:
  any:
  - event: shot_taken
  - all:
    - has_ball: R2
    - ball_in_zone: box
abort:
  any:
  - event: possession_lost
  - event: ball_out
max_duration_s: 9.0
cooldown_s: 15
soft_hints:
  risk: 0.6
  chain_depth: 2
  tempo: fast
