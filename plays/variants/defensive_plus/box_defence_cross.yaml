# Variant play (defensive_plus): ball wide in our third: mark the box and block the cross.
id: box_defence_cross
name: Defend the cross
version: 1
phase: out_of_possession
objective: protect_goal
strategy: low_block
roles:
  - id: F1
    desc: Closest wide defender blocks the cross
    hints: [FB_near, W_near]
  - id: K1
    desc: Markers on the most dangerous attackers in the box
    hints: [CB_near, CB_far, FB_far]
    group: {count: 3}
  - id: D1
    desc: Midfielder protects the cutback zone
    hints: [DM, CM]
  - id: GK
    hints: [GK]
triggers:
  all:
    - possession: them
    - ball_in_zone: [own_third.near_wing, own_third.far_wing]
steps:
  - id: s1
    actions:
      - {role: F1, type: press, target: {opponent: ball_carrier}, curve: force_outside, intensity: 1.0}
      - {role: K1, type: mark, target: {opponent: most_dangerous}, tightness: 1.5, goal_side: true}
      - {role: D1, type: hold_position, to: {anchor: own_goal, offset: [13, 0]}}
      - {role: GK, type: set_position, mode: cover_line}
    done_when:
      any: [{event: possession_won}, {event: ball_out_them_last}, {ball_in_zone: "mid_own.*"}]
    timeout_s: 10
    on_timeout: abort
success:
  any: [{event: possession_won}, {event: ball_out_them_last}, {ball_in_zone: "mid_own.*"}]
abort:
  any: [{event: goal_conceded}]
max_duration_s: 10
cooldown_s: 0
soft_hints: {risk: 0.15, chain_depth: 1, tempo: medium}
