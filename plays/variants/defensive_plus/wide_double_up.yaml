# Variant play (defensive_plus): two players close down a winger in our half; cover inside.
id: wide_double_up
name: Double up on the winger
version: 1
phase: out_of_possession
objective: regain_possession
strategy: mid_block
roles:
  - id: F1
    desc: Full-back shows the winger down the line
    hints: [FB_near]
    prefers: {tackling: 0.6}
  - id: W1
    desc: Winger or midfielder doubles up from inside
    hints: [W_near, CM, DM]
    requires: {stamina: 0.4}
  - id: C1
    desc: Near centre-back covers behind the full-back
    hints: [CB_near]
  - id: M1
    desc: Midfielder screens the cutback
    hints: [DM, CM]
  - id: B
    desc: The rest of the back line shifts across
    hints: [CB_far, FB_far]
    group: {count: 2}
triggers:
  all:
    - possession: them
    - ball_in_zone: [own_third.near_wing, mid_own.near_wing]
steps:
  - id: s1
    actions:
      - {role: F1, type: jockey, target: {opponent: ball_carrier}}
      - {role: W1, type: press, target: {opponent: ball_carrier}, curve: force_outside, intensity: 1.0}
      - {role: C1, type: cover, behind: F1, depth: 5}
      - {role: M1, type: block_lane, from: ball_carrier, to: nearest_receiver}
      - {role: B, type: compact_shift, line_height: 14, width: 30, ball_shift: 0.8}
    done_when:
      any: [{event: possession_won}, {event: ball_out_them_last}, {ball_in_zone: "*.center"}]
    timeout_s: 8
    on_timeout: abort
success:
  any: [{event: possession_won}, {event: ball_out_them_last}]
abort:
  any: [{event: goal_conceded}, {ball_in_zone: own_box}]
max_duration_s: 8
cooldown_s: 4
soft_hints: {risk: 0.35, chain_depth: 1, tempo: fast}
