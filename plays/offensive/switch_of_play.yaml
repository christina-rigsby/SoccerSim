# Library play, version 2 (pool v5, D-053): the shorter 'branchy' rewrite (plays/variants/branchy/)
# with a fallback in every step instead of waiting and timing out; version 1 is in git history.
id: switch_of_play
name: Switch to the isolated far side
version: 2
phase: in_possession
objective: progress_ball
strategy: switch_overload
roles:
- id: R1
  desc: Ball carrier on the crowded side
  hints:
  - FB_near
  - W_near
  - CM
  starts_with_ball: true
- id: R2
  desc: Pivot / switching passer
  hints:
  - DM
  - CB_near
  - CM
  requires:
    passing: 0.55
  prefers:
    vision: 1.0
    passing: 0.8
- id: R3
  desc: Far-side wide receiver
  hints:
  - W_far
  - FB_far
  requires:
    first_touch: 0.4
  prefers:
    pace: 0.7
    dribbling: 0.7
- id: R4
  desc: Far-side support
  hints:
  - FB_far
  - CM
triggers:
  all:
  - possession: us
  - has_ball: R1
  - ball_in_zone:
    - mid_own.near_wing
    - mid_own.near_halfspace
    - mid_opp.near_wing
    - mid_opp.near_halfspace
    - final_third.near_wing
  - count_in_zone:
      team: them
      zone: '*.far_wing'
      le: 1
  - count_in_zone:
      team: them
      zone: '*.near_wing'
      ge: 3
steps:
- id: s1
  choose:
  - when:
      lane_open:
        from: R1
        to:
          role: R3
          lead: 3
        min_p: 0.55
    actions:
    - role: R3
      type: hold_width
      lane: far_wing
    - role: R1
      type: pass
      to:
        role: R3
        lead: 3
      style: lofted
  - when:
      lane_open:
        from: R1
        to:
          role: R2
        min_p: 0.7
    actions:
    - role: R3
      type: hold_width
      lane: far_wing
    - role: R2
      type: support
      from: R1
      angle: back_inside
      distance: 14
    - role: R1
      type: pass
      to:
        role: R2
      style: ground
  - when: always
    actions:
    - role: R1
      type: pass
      to:
        best_teammate:
          score: pass_p
      style: ground
  done_when:
    any:
    - has_ball: R2
    - has_ball: R3
    - event: pass_completed
    - event: pass_intercepted
  timeout_s: 3
  on_timeout: next
- id: s2
  choose:
  - when:
      has_ball: R3
    actions:
    - role: R3
      type: carry
      to:
        pc_best:
          zone: final_third.far_wing
        score: pc_xt
      speed: fast
    - role: R4
      type: overlap
      around: R3
      to:
        anchor: role:R3
        offset:
        - 10
        - -4
  - when:
      all:
      - has_ball: R2
      - lane_open:
          from: R2
          to:
            role: R3
            lead: 3
          min_p: 0.55
    actions:
    - role: R2
      type: pass
      to:
        role: R3
        lead: 3
      style: lofted
  - when: always
    actions:
    - actor: ball_holder
      type: carry
      to:
        pc_best:
          zone: mid_opp.*
        score: pc_xt
      speed: fast
  done_when:
    any:
    - ball_in_zone: final_third.*
    - event: pass_completed
    - step_elapsed_s:
        gt: 2.5
  timeout_s: 3
  on_timeout: next
success:
  all:
  - has_ball: R3
  - any:
    - ball_in_zone: final_third.*
    - pressure_on:
        ref: role:R3
        gt: 5
abort:
  any:
  - event: possession_lost
  - event: ball_out
max_duration_s: 9.0
cooldown_s: 15
soft_hints:
  risk: 0.3
  chain_depth: 3
  tempo: medium
