# Hand-written build-up play: the winger checks short to receive in front of the block.
id: winger_checks_short
name: Winger checks short to receive
version: 1
phase: in_possession
objective: progress_ball
strategy: local_combination
roles:
  - id: R1
    desc: Full-back or centre-back on the ball, near side
    hints: [FB_near, CB_near, DM]
    starts_with_ball: true
  - id: R2
    desc: Winger checking to the ball
    hints: [W_near, AM]
    requires: {first_touch: 0.5}
    prefers: {dribbling: 0.7}
  - id: R3
    desc: Inside midfielder for the lay-off
    hints: [CM, AM, DM]
triggers:
  all:
    - possession: us
    - has_ball: R1
    - ball_in_zone: [own_third.near_wing, own_third.near_halfspace, mid_own.near_wing, mid_own.near_halfspace]
    - not: {ball_beyond_line: {line: opp_first_line}}
steps:
  - id: s1
    actions:
      - {role: R2, type: check_to_ball, distance: 8, duration_s: 1.2}
      - {role: R3, type: support, from: R2, angle: back_inside, distance: 10}
    done_when: {step_elapsed_s: {gt: 1.2}}
    timeout_s: 2
    on_timeout: next
  - id: s2
    choose:
      - when: {lane_open: {from: R1, to: {role: R2}, min_p: 0.7}}
        actions: [{role: R1, type: pass, to: {role: R2}, style: driven}]
      - when: always
        actions: [{role: R1, type: pass, to: {role: R3}, style: ground}]
    done_when: {any: [{event: pass_completed}, {event: pass_intercepted}]}
    timeout_s: 3
    on_timeout: abort
  - id: s3
    choose:
      - when: {all: [{has_ball: R2}, {pressure_on: {ref: role:R2, gt: 3}}]}
        actions: [{role: R2, type: carry, to: {pc_best: {anchor: ball, radius: 12}, score: pc_xt}, speed: fast}]
      - when: {lane_open: {from: ball_holder, to: {role: R3}, min_p: 0.65}}
        actions: [{actor: ball_holder, type: pass, to: {role: R3}, style: ground, one_touch: true}]
      - when: always
        actions: [{actor: ball_holder, type: pass, to: {best_teammate: {score: pass_p}}, style: ground}]
    done_when: {any: [{event: pass_completed}, {event: pass_intercepted}, {step_elapsed_s: {gt: 3}}]}
    timeout_s: 4
    on_timeout: abort
success:
  all: [{possession: us}, {any: [{has_ball: R2}, {has_ball: R3}]}, {ball_beyond_line: {line: opp_first_line}}]
abort:
  any: [{event: possession_lost}, {event: ball_out}]
max_duration_s: 10
cooldown_s: 8
soft_hints: {risk: 0.3, chain_depth: 3, tempo: medium}
