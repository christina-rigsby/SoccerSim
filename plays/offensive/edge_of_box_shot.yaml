# Hand-written finishing play: work the ball into a shooting spot at the edge of the box and
# shoot only when no defender is in the way (shot_clear); otherwise lay it off.
id: edge_of_box_shot
name: Shot from the edge of the box
version: 1
phase: in_possession
objective: score
strategy: central_combination
roles:
  - id: R1
    desc: Shooter on the ball around the edge of the box
    hints: [AM, CM, ST, W_near, W_far]
    requires: {finishing: 0.4}
    prefers: {finishing: 0.8, composure: 0.6}
    starts_with_ball: true
  - id: R2
    desc: Option for the lay-off if the shot is blocked
    hints: [ST, AM, CM, W_far]
triggers:
  all:
    - possession: us
    - has_ball: R1
    - ball_in_zone: [final_third.center, final_third.near_halfspace, zone14]
    - not: {pressure_on: {ref: role:R1, lt: 2}}
steps:
  - id: s1
    choose:
      - when: {all: [{shot_clear: {ref: role:R1}}, {xg: {ref: role:R1, gt: 0.06}}]}
        actions: [{role: R1, type: shoot, placement: auto, style: placed}]
      - when: always
        actions:
          - {role: R1, type: carry, to: {pc_best: {zone: final_third.center}, score: pc_xt}, speed: fast}
          - {role: R2, type: support, from: R1, angle: square, distance: 9}
    done_when: {any: [{event: shot_taken}, {step_elapsed_s: {gt: 2.0}}]}
    timeout_s: 2.5
    on_timeout: next
  - id: s2
    choose:
      - when: {shot_clear: {ref: role:R1}}
        actions: [{role: R1, type: shoot, placement: auto, style: placed}]
      - when: {lane_open: {from: R1, to: {role: R2}, min_p: 0.6}}
        actions: [{role: R1, type: pass, to: {role: R2}, style: ground}]
      - when: always
        actions: [{role: R1, type: pass, to: {best_teammate: {score: pass_p}}, style: ground}]
    done_when: {any: [{event: shot_taken}, {event: pass_completed}, {event: pass_intercepted}]}
    timeout_s: 3
    on_timeout: abort
success:
  any: [{event: shot_taken}, {event: goal}]
abort:
  any: [{event: possession_lost}, {event: ball_out}]
max_duration_s: 7
cooldown_s: 6
soft_hints: {risk: 0.35, chain_depth: 2, tempo: fast}
