# Hand-written build-up play (own third / own half): an unpressed centre-back steps in.
id: cb_carry_into_midfield
name: Centre-back carries into midfield
version: 1
phase: in_possession
objective: progress_ball
strategy: build_from_back
roles:
  - id: R1
    desc: Centre-back on the ball with space in front
    hints: [CB_near, CB_far]
    requires: {first_touch: 0.4}
    prefers: {dribbling: 0.6, composure: 0.8}
    starts_with_ball: true
  - id: R2
    desc: Midfielder ahead to receive once the first line is broken
    hints: [CM, AM, DM]
    requires: {first_touch: 0.4}
  - id: R3
    desc: Cover for the stepping centre-back
    hints: [DM, CB_far, CB_near]
triggers:
  all:
    - possession: us
    - has_ball: R1
    - ball_in_zone: [own_third.center, own_third.near_halfspace, own_third.far_halfspace, mid_own.center,
                     mid_own.near_halfspace, mid_own.far_halfspace]
    - pressure_on: {ref: role:R1, gt: 7}
    - not: {ball_beyond_line: {line: opp_first_line}}
steps:
  - id: s1
    actions:
      - {role: R1, type: carry, to: {pc_best: {anchor: ball, radius: 14}, score: pc_xt}, speed: jog, protect: true}
      - {role: R3, type: cover, behind: R1, depth: 10}
      - {role: R2, type: support, from: R1, angle: forward, distance: 14}
    done_when: {any: [{pressure_on: {ref: role:R1, lt: 3.5}}, {ball_beyond_line: {line: opp_first_line}},
                      {step_elapsed_s: {gt: 4}}]}
    timeout_s: 5
    on_timeout: next
  - id: s2
    choose:
      - when: {lane_open: {from: R1, to: {role: R2}, min_p: 0.7}}
        actions: [{role: R1, type: pass, to: {role: R2}, style: ground}]
      - when: always
        actions: [{role: R1, type: pass, to: {best_teammate: {score: pass_p}}, style: ground}]
    done_when: {any: [{event: pass_completed}, {event: pass_intercepted}]}
    timeout_s: 3
    on_timeout: abort
success:
  all: [{possession: us}, {ball_beyond_line: {line: opp_first_line}}]
abort:
  any: [{event: possession_lost}, {event: ball_out}]
max_duration_s: 10
cooldown_s: 8
soft_hints: {risk: 0.25, chain_depth: 2, tempo: medium}
