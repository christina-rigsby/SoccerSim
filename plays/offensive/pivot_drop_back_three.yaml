# Hand-written build-up play: the pivot drops between the centre-backs to beat a two-man press.
id: pivot_drop_back_three
name: Pivot drops to make a back three
version: 1
phase: in_possession
objective: progress_ball
strategy: build_from_back
roles:
  - id: R1
    desc: Centre-back on the ball
    hints: [CB_near, CB_far]
    starts_with_ball: true
  - id: R2
    desc: Pivot dropping between the centre-backs
    hints: [DM, CM]
    requires: {first_touch: 0.5, passing: 0.5}
    prefers: {composure: 1.0, vision: 0.6}
  - id: R3
    desc: Other centre-back splitting wide
    hints: [CB_far, CB_near]
  - id: R4
    desc: Midfielder ahead between the lines
    hints: [CM, AM]
triggers:
  all:
    - possession: us
    - has_ball: R1
    - ball_in_zone: ["own_third.*"]
    - count_in_zone: {team: them, zone: "own_third.*", ge: 2}
    - not: {ball_beyond_line: {line: opp_first_line}}
steps:
  - id: s1
    actions:
      - {role: R2, type: run_to, to: {anchor: own_goal, offset: [16, 0]}, speed: fast}
      - {role: R3, type: run_to, to: {anchor: own_goal, offset: [14, -20]}, speed: jog}
      - {role: R4, type: hold_position, to: {zone: mid_own.center, pick: centroid}}
    done_when: {step_elapsed_s: {gt: 1.5}}
    timeout_s: 2
    on_timeout: next
  - id: s2
    choose:
      - when: {lane_open: {from: R1, to: {role: R2}, min_p: 0.75}}
        actions: [{role: R1, type: pass, to: {role: R2}, style: ground}]
      - when: always
        actions: [{role: R1, type: pass, to: {role: R3}, style: ground}]
    done_when: {any: [{event: pass_completed}, {event: pass_intercepted}]}
    timeout_s: 3
    on_timeout: abort
  - id: s3
    choose:
      - when: {lane_open: {from: ball_holder, to: {role: R4}, min_p: 0.65}}
        actions: [{actor: ball_holder, type: pass, to: {role: R4}, style: ground}]
      - when: always
        actions: [{actor: ball_holder, type: carry, to: {pc_best: {anchor: ball, radius: 10}, score: pc_xt},
                   speed: jog, protect: true}]
    done_when: {any: [{event: pass_completed}, {event: pass_intercepted}, {step_elapsed_s: {gt: 3}}]}
    timeout_s: 4
    on_timeout: abort
success:
  all: [{possession: us}, {any: [{has_ball: R2}, {has_ball: R3}, {has_ball: R4}]}, {ball_beyond_line: {line: opp_first_line}}]
abort:
  any: [{event: possession_lost}, {event: ball_out}]
max_duration_s: 12
cooldown_s: 10
soft_hints: {risk: 0.2, chain_depth: 3, tempo: slow}
