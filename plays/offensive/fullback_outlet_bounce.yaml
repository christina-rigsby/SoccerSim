# Hand-written build-up play: centre-back finds the full-back wide, who bounces it inside.
id: fullback_outlet_bounce
name: Full-back outlet and bounce inside
version: 1
phase: in_possession
objective: progress_ball
strategy: build_from_back
roles:
  - id: R1
    desc: Centre-back on the ball
    hints: [CB_near, CB_far, DM]
    requires: {passing: 0.45}
    starts_with_ball: true
  - id: R2
    desc: Full-back holding width as the outlet
    hints: [FB_near, FB_far]
    requires: {first_touch: 0.4}
  - id: R3
    desc: Midfielder offering the inside bounce
    hints: [CM, DM, AM]
    requires: {first_touch: 0.45}
  - id: R4
    desc: Winger pinning the opposing full-back
    hints: [W_near, W_far]
triggers:
  all:
    - possession: us
    - has_ball: R1
    - ball_in_zone: ["own_third.*", mid_own.center, mid_own.near_halfspace, mid_own.far_halfspace]
    - lane_open: {from: R1, to: {role: R2}, min_p: 0.7}
    - not: {ball_beyond_line: {line: opp_first_line}}
steps:
  - id: s1
    actions:
      - {role: R4, type: hold_width, lane: near_wing}
      - {role: R3, type: support, from: R2, angle: square, distance: 12}
      - {role: R1, type: pass, to: {role: R2}, style: ground}
    done_when: {any: [{has_ball: R2}, {event: pass_intercepted}]}
    timeout_s: 3
    on_timeout: abort
  - id: s2
    choose:
      - when: {lane_open: {from: R2, to: {role: R3}, min_p: 0.7}}
        actions: [{role: R2, type: pass, to: {role: R3}, style: ground, one_touch: true}]
      - when: {lane_open: {from: R2, to: {role: R4}, min_p: 0.65}}
        actions: [{role: R2, type: pass, to: {role: R4}, style: ground}]
      - when: always
        actions: [{role: R2, type: carry, to: {pc_best: {anchor: ball, radius: 10}, score: pc_xt}, speed: jog,
                   protect: true}]
    done_when: {any: [{event: pass_completed}, {event: pass_intercepted}, {step_elapsed_s: {gt: 3}}]}
    timeout_s: 4
    on_timeout: abort
success:
  all: [{possession: us}, {any: [{has_ball: R3}, {has_ball: R4}]}, {ball_beyond_line: {line: opp_first_line}}]
abort:
  any: [{event: possession_lost}, {event: ball_out}]
max_duration_s: 10
cooldown_s: 8
soft_hints: {risk: 0.25, chain_depth: 2, tempo: medium}
