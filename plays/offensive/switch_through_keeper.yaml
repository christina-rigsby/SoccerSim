# Hand-written build-up play: pressed on one side, recycle through the keeper to the far side.
id: switch_through_keeper
name: Switch play through the goalkeeper
version: 1
phase: in_possession
objective: retain_possession
strategy: switch_overload
roles:
  - id: R1
    desc: Defender on the ball on the pressed side
    hints: [CB_near, FB_near, CB_far]
    starts_with_ball: true
  - id: GK
    hints: [GK]
    requires: {passing: 0.4}
  - id: R2
    desc: Far-side centre-back or full-back
    hints: [CB_far, FB_far]
    requires: {first_touch: 0.4}
triggers:
  all:
    - possession: us
    - has_ball: R1
    - ball_in_zone: [own_third.near_wing, own_third.near_halfspace, own_third.center]
    - pressure_on: {ref: role:R1, lt: 5}
    - lane_open: {from: R1, to: {role: GK}, min_p: 0.8}
steps:
  - id: s1
    actions:
      - {role: R2, type: run_to, to: {anchor: own_goal, offset: [16, -22]}, speed: jog}
      - {role: R1, type: pass, to: {role: GK}, style: ground}
    done_when: {any: [{has_ball: GK}, {event: pass_intercepted}]}
    timeout_s: 3
    on_timeout: abort
  - id: s2
    choose:
      - when: {lane_open: {from: GK, to: {role: R2}, min_p: 0.75}}
        actions: [{role: GK, type: distribute, to: {role: R2}, style: ground}]
      - when: always
        actions: [{role: GK, type: distribute, to: {best_teammate: {score: pass_p}}, style: lofted}]
    done_when: {any: [{event: pass_completed}, {event: pass_intercepted}, {event: ball_out}]}
    timeout_s: 4
    on_timeout: abort
success:
  all: [{possession: us}, {has_ball: R2}, {pressure_on: {ref: role:R2, gt: 5}}]
abort:
  any: [{event: possession_lost}, {event: ball_out}]
max_duration_s: 9
cooldown_s: 12
soft_hints: {risk: 0.3, chain_depth: 2, tempo: slow}
