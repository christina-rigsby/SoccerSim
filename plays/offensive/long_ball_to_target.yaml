# Hand-written build-up play: under pressure deep, go long to the striker and win the second ball.
id: long_ball_to_target
name: Long ball to the target forward
version: 1
phase: in_possession
objective: progress_ball
strategy: exploit_depth
roles:
  - id: R1
    desc: Deep player on the ball, being pressed
    hints: [CB_near, CB_far, GK, DM, FB_near, FB_far]
    requires: {passing: 0.4}
    starts_with_ball: true
  - id: R2
    desc: Target forward
    hints: [ST]
    prefers: {aerial: 1.0, first_touch: 0.5}
  - id: R3
    desc: Midfielder arriving for the knock-down
    hints: [AM, CM, W_near]
    prefers: {first_touch: 0.6}
triggers:
  all:
    - possession: us
    - has_ball: R1
    - ball_in_zone: ["own_third.*", "mid_own.*"]
    - pressure_on: {ref: role:R1, lt: 4}
    - not: {ball_beyond_line: {line: opp_second_line}}
steps:
  - id: s1
    actions:
      - {role: R2, type: hold_position, to: {zone: mid_opp.center, pick: centroid}}
      - {role: R3, type: support, from: R2, angle: back_inside, distance: 8}
      - {role: R1, type: pass, to: {role: R2}, style: lofted}
    done_when: {any: [{event: pass_completed}, {event: pass_intercepted}, {event: ball_out}]}
    timeout_s: 4
    on_timeout: abort
  - id: s2
    start_when: {has_ball: R2}
    actions:
      - {role: R2, type: pass, to: {role: R3}, style: ground, one_touch: true}
    done_when: {any: [{has_ball: R3}, {event: pass_intercepted}]}
    timeout_s: 3
    on_timeout: abort
success:
  all: [{possession: us}, {any: [{has_ball: R2}, {has_ball: R3}]}, {ball_beyond_line: {line: opp_second_line}}]
abort:
  any: [{event: possession_lost}, {event: ball_out}]
max_duration_s: 9
cooldown_s: 10
soft_hints: {risk: 0.5, chain_depth: 2, tempo: fast}
