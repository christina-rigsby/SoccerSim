# Library play, version 2 (pool v5, D-053): the shorter 'branchy' rewrite (plays/variants/branchy/)
# with a fallback in every step instead of waiting and timing out; version 1 is in git history.
id: wide_overlap_cross
name: Wide overlap and delivery
version: 2
phase: in_possession
objective: create_chance
strategy: wide_overload
roles:
- id: R1
  desc: Wide player on the ball
  hints:
  - W_near
  - FB_near
  requires:
    dribbling: 0.4
    passing: 0.4
  starts_with_ball: true
- id: R2
  desc: Overlapping full-back
  hints:
  - FB_near
  requires:
    pace: 0.5
    stamina: 0.4
  prefers:
    crossing: 1.0
    pace: 0.5
- id: R3
  desc: Striker attacking near post
  hints:
  - ST
  prefers:
    finishing: 1.0
    aerial: 0.5
- id: R4
  desc: Far-side runner attacking far post
  hints:
  - W_far
  - AM
  prefers:
    finishing: 0.7
    aerial: 0.7
- id: R5
  desc: Edge-of-box support for cutbacks and second balls
  hints:
  - AM
  - CM
  prefers:
    finishing: 0.5
    passing: 0.5
triggers:
  all:
  - possession: us
  - has_ball: R1
  - ball_in_zone:
    - mid_opp.near_wing
    - final_third.near_wing
  - dist:
      a: role:R2
      b: role:R1
      lt: 20
  - count_in_zone:
      team: them
      zone: final_third.near_wing
      le: 2
hard_constraints:
- not:
    pressure_on:
      ref: role:R1
      lt: 1.5
steps:
- id: s1
  actions:
  - role: R1
    type: carry
    to:
      anchor: ball
      offset:
      - 3
      - -5
    speed: jog
  - role: R2
    type: overlap
    around: R1
    to:
      anchor: role:R1
      offset:
      - 12
      - 5
  - role: R3
    type: run_to
    to:
      zone: near_post_area
    speed: fast
  - role: R4
    type: run_to
    to:
      zone: far_post_area
    speed: fast
  - role: R5
    type: support
    from: R1
    angle: back_inside
    distance: 12
  done_when:
    any:
    - ahead_of:
        a: role:R2
        b: role:R1
        by: 3
    - step_elapsed_s:
        gt: 2.5
  timeout_s: 3
  on_timeout: next
- id: s2
  choose:
  - when:
      lane_open:
        from: R1
        to:
          role: R2
          lead: 4
        min_p: 0.6
    actions:
    - role: R1
      type: pass
      to:
        role: R2
        lead: 4
      style: ground
  - when:
      ball_in_zone: final_third.*
    actions:
    - role: R1
      type: cross
      to:
        role: R3
      style: whipped
  - when: always
    actions:
    - role: R1
      type: pass
      to:
        best_teammate:
          score: pc_xt
      style: ground
  done_when:
    any:
    - has_ball: R2
    - event: pass_completed
    - event: pass_intercepted
    - event: ball_out
  timeout_s: 3
  on_timeout: next
- id: s3
  choose:
  - when:
      all:
      - has_ball: R2
      - pc_at:
          target:
            zone: cutback_zone
          gt: 0.6
    actions:
    - role: R2
      type: cutback
      to:
        role: R5
    - role: R5
      type: run_to
      to:
        zone: cutback_zone
      speed: fast
  - when:
      has_ball: R2
    actions:
    - role: R2
      type: cross
      to:
        role: R3
      style: driven_low
  - when: always
    actions:
    - actor: ball_holder
      type: pass
      to:
        best_teammate:
          score: xt
          zone: box
      style: ground
  done_when:
    any:
    - event: pass_completed
    - event: pass_intercepted
    - event: ball_out
    - event: shot_taken
  timeout_s: 3
  on_timeout: next
- id: fin
  choose:
  - when:
      xg:
        ref: ball_holder
        gt: 0.07
    actions:
    - actor: ball_holder
      type: shoot
      placement: auto
      style: placed
  - when: always
    actions:
    - actor: ball_holder
      type: pass
      to:
        best_teammate:
          score: xt
          zone: box
      style: ground
  done_when:
    any:
    - event: shot_taken
    - event: pass_completed
  timeout_s: 2
  on_timeout: abort
success:
  any:
  - event: shot_taken
  - event: goal
abort:
  any:
  - event: possession_lost
  - event: ball_out
max_duration_s: 9.0
cooldown_s: 20
soft_hints:
  risk: 0.4
  chain_depth: 5
  tempo: medium
