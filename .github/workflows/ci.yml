name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,ml]"
      - name: Ruff
        run: ruff check soccersim tests scripts
      - name: Validate plays
        run: python -c "from soccersim.schema import load_library; print(len(load_library()), 'plays valid')"
      - name: Pytest
        run: pytest -W error::RuntimeWarning
